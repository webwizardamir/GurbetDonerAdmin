<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- viewport-fit=cover lets `env(safe-area-inset-*)` resolve to real values so
         index.css can pad the notch/home-indicator gutters instead of leaving them
         unpainted. Deliberately NO maximum-scale / user-scalable=no: that blocks
         pinch-zoom and fails WCAG 1.4.4. iOS focus-zoom is handled by font-size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Shared by both tenant builds; applyTenant() sets the real title and
         favicon at runtime (see src/config/tenant.ts). Kept brand-neutral so
         neither tenant flashes the other's name before React mounts. -->
    <title>B2B Portal</title>
    <!-- Set the theme class BEFORE first paint. Header.tsx applies it in a
         useEffect, which runs after React mounts, so a dark-mode user saw a
         white flash on every load. Must stay in sync with Header.tsx's
         `darkMode` initializer and PortalLayout/PortalLogin's toggles.

         ⚠️ EDITING THIS SCRIPT? Its sha256 is whitelisted in vercel.json's CSP,
         which has no 'unsafe-inline' in script-src. Change one byte — even the
         indentation — and the browser BLOCKS it in production; the app still
         works, so the only symptom is a console error and the return of the
         flash this exists to prevent. `npm run build` fails loudly and prints
         the new hash to paste (scripts/check-csp.mjs). Never "fix" a CSP block
         by adding 'unsafe-inline'; that turns off XSS protection app-wide.

         It has to be INLINE: an external src costs a render-blocking request on
         every load, and a module script is deferred, so both let the paint
         happen first and defeat the purpose. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkMode')
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) { /* private mode / storage disabled - fall through to light */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
